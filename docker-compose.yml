services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: netflix_ci
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U netflix -d netflix_ci"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://netflix:netflix@db:5432/netflix_ci
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-local}
    ports: ["8501:8501"]
volumes:
  pgdata:
